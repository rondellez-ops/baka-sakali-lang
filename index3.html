<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kape enjoyer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f5f5f4;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      overflow: hidden;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      margin: 10px;
      cursor: pointer;
    }
    #yes {
      background: #111827;
      color: white;
    }
    #no {
      background: #e5e7eb;
      position: absolute;
    }
    .date-btn {
      background: #111827;
      color: white;
      display: block;
      width: 200px;
      margin: 10px auto;
    }
    #dates {
      display: none;
    }
    .gif {
      width: 150px;
      margin-bottom: 15px;
    }

  </style>
</head>
<body>

  <div class="box">
  <img src="coffewink.gif" class="gif">
    <h2>Okay, we go ML </h2>
    <h1>Pero baka gusto mo magkape? 🫣</h1>

    <button id="yes" onclick="showDates()">YES</button>
    <button id="no" onmouseover="moveNo()">NO</button>

    <div id="dates">
      <h3>HAHAHAHA sea salt latte for a reason. Kelan ka free?</h3>
      <button class="date-btn" onclick="pickDate('Friday')">Friday</button>
      <button class="date-btn" onclick="pickDate('Saturday')">Saturday</button>
      <button class="date-btn" onclick="pickDate('Sunday')">Sunday</button>
    </div>
  </div>

  <script>
    function showDates() {
      document.getElementById("dates").style.display = "block";
    }
    function pickDate(day) {
      localStorage.setItem("chosenDate", day);
      window.location.href = "index4.html";
    }
    function moveNo() {
      const noBtn = document.getElementById("no");
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
    }
  </script>

</body>
</html>
