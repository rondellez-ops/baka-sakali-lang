<!DOCTYPE html>
<html>
<head>
    <title>Hellooo</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Segoe UI, sans-serif;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }


        

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .msgbox {
            width: 300px;
            background-color: #f0f0f0;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .msgbox-header {
            background-color: #0078D7;
            color: white;
            padding: 8px;
            font-weight: bold;
        }

        .msgbox-body {
            padding: 20px;
            color: black;
        }

        .msgbox-footer {
            text-align: right;
            padding: 10px;
        }

        .msgbox-footer button {
            padding: 5px 15px;
        }
    </style>
</head>
<body>

<video autoplay muted loop id="bg-video">
    <source src="bg.mp4" type="video/mp4">
</video>

<button onclick="showMsg()">Click Me</button>

<audio id="clickSound" src="kalapastangan.mp3"></audio>

<div class="overlay" id="popup">
    <div class="msgbox">
        <div class="msgbox-header">
            Message
        </div>
        <div class="msgbox-body">
            I've kind of liked you for a long time now. 💌
        </div>
        <div class="msgbox-footer">
            <button onclick="closeMsg()">OK</button>
        </div>
    </div>
</div>

<script>
let messages = [
    "De aydul ano kase",
    "Eto talaga yung main event",
    "eme eme lang yung mga nauna kanina",
    "pero baka pwede ka naman diba👉👈🥺",
    "de jk lang",
    "ganto kasi yan"
];

let currentIndex = 0;

function showMsg() {
    var sound = document.getElementById("clickSound");
    sound.volume = 0.2;
    sound.play();

    currentIndex = 0;
    document.querySelector(".msgbox-body").innerText = messages[currentIndex];
    document.getElementById("popup").style.display = "flex";
}

function closeMsg() {
    currentIndex++;

    if (currentIndex < messages.length) {
        document.querySelector(".msgbox-body").innerText = messages[currentIndex];
    } else {
        document.getElementById("popup").style.display = "none";
    }
}
</script>

</body>
</html>
