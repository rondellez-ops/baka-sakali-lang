<!DOCTYPE html>
<html lang="en">
<head>

  <title>Hi Aydul</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f4;
      font-family: Arial, sans-serif;
    }
    .box {
      background: white;
      padding: 50px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 30px;
    }
    button {
      padding: 12px 32px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #111827;
      color: white;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Hi, Aydul 👋</h1>
    <p>May gusto lang akong itanong…</p>
    <button onclick="goNext()">Next →</button>
  </div>

  <script>

      window.location.href = "index2.html";

  </script>

</html>
